services:

  # ==========================================
  # MongoDB
  # ==========================================
  mongodb:
    image: mongo:8
    container_name: leaveweb-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: leaveweb

    volumes:
      - mongodb_data:/data/db

    ports:
      - "27017:27017"

    networks:
      - leaveweb-network


  # ==========================================
  # Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: leaveweb-backend:local
    container_name: leaveweb-backend

    restart: unless-stopped

    depends_on:
      - mongodb

    environment:
      MONGODB_URI: mongodb://mongodb:27017/leaveweb
      JWT_SECRET: ${JWT_SECRET:-LeaveWebDevelopmentSecretKey2026ForLocalDevelopmentOnlyChangeThisInProduction}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@leaveweb.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@12345}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-LeaveWeb Admin}

      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-noreply@leaveweb.com}

    ports:
      - "8080:8080"

    networks:
      - leaveweb-network


  # ==========================================
  # Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: leaveweb-frontend:local
    container_name: leaveweb-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"

    networks:
      - leaveweb-network


  # ==========================================
  # Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: leaveweb-prometheus

    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    ports:
      - "9090:9090"

    depends_on:
      - backend

    networks:
      - leaveweb-network


  # ==========================================
  # Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: leaveweb-grafana

    restart: unless-stopped

    volumes:
      - grafana_data:/var/lib/grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    networks:
      - leaveweb-network


# ==========================================
# Volumes
# ==========================================
volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:


# ==========================================
# Network
# ==========================================
networks:
  leaveweb-network:
    driver: bridge