spring.application.name=leaveweb-backend
spring.profiles.default=dev

# =========================================
# MongoDB
# =========================================

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/leaveweb}

# =========================================
# Server
# =========================================

server.port=${SERVER_PORT:8080}

# =========================================
# JWT
# =========================================

app.jwt.secret=${JWT_SECRET:LeaveWebDevelopmentSecretKey2026ForLocalDevelopmentOnlyChangeThisInProduction}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================================
# Bootstrap Admin
# =========================================

app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@leaveweb.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:LeaveWeb Admin}

# =========================================
# CORS
# =========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}

# =========================================
# Mail
# =========================================

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:noreply@leaveweb.com}

# Disable mail health check during local development
management.health.mail.enabled=false

# =========================================
# Actuator / Monitoring
# =========================================

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# =========================================
# JSON
# =========================================

spring.jackson.serialization.write-dates-as-timestamps=false

# =========================================
# Logging
# =========================================

logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb.driver=INFO