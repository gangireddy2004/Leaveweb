apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: leaveweb
  labels:
    app: backend
    app.kubernetes.io/name: leaveweb-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: leaveweb-backend

    spec:
      containers:
        - name: backend
          image: leaveweb-backend:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: leaveweb-config

            - secretRef:
                name: leaveweb-secret

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"