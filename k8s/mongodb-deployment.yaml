apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: leaveweb
  labels:
    app: mongodb
    app.kubernetes.io/name: leaveweb-mongodb

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/name: leaveweb-mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:8
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 27017
              protocol: TCP

          env:
            - name: MONGO_INITDB_DATABASE
              value: leaveweb

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: mongodb-data
          emptyDir: {}